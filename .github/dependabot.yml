# Keeps dependencies and GitHub Actions up to date. Minor and patch updates are
# grouped into one weekly PR per ecosystem; major updates arrive as separate
# PRs so breaking changes are reviewed one at a time. Security updates are
# raised as soon as an advisory is published, regardless of this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
