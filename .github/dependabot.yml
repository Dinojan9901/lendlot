# Keeps dependencies and GitHub Actions up to date. Minor and patch updates are
# grouped into one weekly PR per ecosystem; major updates arrive as separate
# PRs so breaking changes are reviewed one at a time. Security updates are
# raised as soon as an advisory is published, regardless of this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Keep the types in step with the Node 22 runtime; bump both together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (the native rewrite) isn't supported by the Next.js toolchain yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
