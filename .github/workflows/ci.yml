name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  quality:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lendlot
          POSTGRES_PASSWORD: lendlot
          POSTGRES_DB: lendlot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lendlot" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://lendlot:lendlot@localhost:5432/lendlot_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    name: Build & Playwright E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lendlot
          POSTGRES_PASSWORD: lendlot
          POSTGRES_DB: lendlot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lendlot" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://lendlot:lendlot@localhost:5432/lendlot_test
      TEST_DATABASE_URL: postgresql://lendlot:lendlot@localhost:5432/lendlot_test
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # A throwaway secret per run; real secrets never live in the repo.
      - run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Migrate and seed
        run: npx prisma migrate deploy && npx prisma db seed
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
