name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

# Least privilege for the GITHUB_TOKEN in every job.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lendlot
          POSTGRES_PASSWORD: lendlot
          POSTGRES_DB: lendlot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lendlot" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://lendlot:lendlot@localhost:5432/lendlot_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    name: Build & Playwright E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lendlot
          POSTGRES_PASSWORD: lendlot
          POSTGRES_DB: lendlot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lendlot" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://lendlot:lendlot@localhost:5432/lendlot_test
      TEST_DATABASE_URL: postgresql://lendlot:lendlot@localhost:5432/lendlot_test
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # A throwaway secret per run; real secrets never live in the repo.
      - run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Migrate and seed
        run: npx prisma migrate deploy && npx prisma db seed
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  security-scan:
    name: Security scan (Trivy + npm audit)
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: 0.76.1
      # Pinned checksum of the official release tarball: a tampered download fails the job.
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
    steps:
      - uses: actions/checkout@v7
      - name: Install Trivy (checksum-verified, no third-party action)
        run: |
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          echo "${TRIVY_SHA256}  ${tarball}" | sha256sum --check
          tar -xzf "$tarball" trivy
          sudo mv trivy /usr/local/bin/trivy
          trivy --version
      - name: Trivy — dependencies, secrets and misconfigurations
        # Fails on HIGH/CRITICAL. Accepted exceptions live in .trivyignore,
        # each with a reason and an expiry date.
        run: >-
          trivy fs .
          --scanners vuln,secret,misconfig
          --severity HIGH,CRITICAL
          --ignorefile .trivyignore
          --exit-code 1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
